hijacksession.title=Hijack a session

hijacksession.hints.1=Check the 'hijack_cookie' cookie value and think about its format.
hijacksession.hints.2=The 'hijack_cookie' contains two long random numbers separated by a hyphen.
hijacksession.hints.3=Neither number is a sequence or a timestamp.
hijacksession.hints.4=Send multiple requests and check that new cookies do not reveal the next value.
hijacksession.hints.5=Sometimes, authorized users logs into the application.
