hijacksession.title=Hijack a session

hijacksession.hints.1=Check the 'hijack_cookie' cookie value and think about its format.
hijacksession.hints.2=The 'hijack_cookie' contains a number, a timestamp, and a random suffix.
hijacksession.hints.3=The first two parts are observable metadata; the random suffix is required for authentication.
hijacksession.hints.4=Send multiple requests and check that the random suffix cannot be predicted from earlier cookies.
hijacksession.hints.5=Sometimes, authorized users logs into the application.
